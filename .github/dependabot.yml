# Weekly updates, small ones grouped so they arrive as one pull request.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # All pinned to one version.
      dioxus:
        patterns: ["dioxus*"]
      # Left out, so each gets its own pull request: grit-lib is the git engine, reviewed on every
      # bump, and velopack stays red until VPK_VERSION in release.yml matches, which would hold up
      # everything grouped with it.
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["grit-lib", "velopack"]
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
