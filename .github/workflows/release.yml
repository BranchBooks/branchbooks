# A version tag on main publishes a GitHub release: Setup, the update packages and the feed the app
# reads (crates/branchbooks-ui/src/update.rs). The tag must match the workspace version in Cargo.toml.
#   git tag v0.1.0 && git push origin v0.1.0
# Run by hand on any branch, it is a rehearsal: it builds and packs the app, keeps Setup as a download
# from the run, and publishes nothing.
#
# Compiling runs every dependency's build script and macros, so the job that compiles holds no token
# that can write. Only the publish job can, and it compiles nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Velopack CLI, the same version as the crate in crates/branchbooks-ui/Cargo.toml (CI checks).
  VPK_VERSION: 1.3.39-g8d2844f

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # All of history, to check the tag is on main. No cache: what ships is compiled here, from source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The version, and a tag must match it and be on main
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if test "$GITHUB_REF_TYPE" = tag; then
            test "$GITHUB_REF_NAME" = "v$version"
            git merge-base --is-ancestor HEAD origin/main
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install the toolchain in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-msvc
      - run: tools/windows/build.ps1
        shell: pwsh
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: "8.0.x"
      - name: Install vpk
        run: dotnet tool install -g vpk --version "$VPK_VERSION"
      # The previous release goes in the folder so that the pack can build a delta from it. The first
      # release has none, which vpk only warns about.
      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          vpk download github --repoUrl "$repo" --token "$GH_TOKEN" -c win -o releases
          vpk pack -u BranchBooks -v "$VERSION" -p dist/windows -e BranchBooks.exe -r win-x64 \
            --packTitle BranchBooks --packAuthors BranchBooks -f webview2 -c win -o releases \
            --icon crates/branchbooks-ui/icons/icon.ico --splashImage crates/branchbooks-ui/icons/splash.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: releases
          path: releases/
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: releases
          path: releases
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: "8.0.x"
      - name: Install vpk
        run: dotnet tool install -g vpk --version "$VPK_VERSION"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk upload github --repoUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
            -c win -o releases --tag "$GITHUB_REF_NAME" --releaseName "BranchBooks ${GITHUB_REF_NAME#v}" --publish
