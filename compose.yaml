# Development: every tool runs in the image from tools/dev, so the host needs only Docker.
#   docker compose run --rm dev cargo test    any command (no command: a shell)
#   docker compose run --rm dev cargo run -q -p branchbooks-oracle   compare with real Beancount

x-dev: &dev
  build:
    context: tools/dev
    # The container's user gets your ids (bash sets UID but does not export it; 1000 otherwise).
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: branchbooks-dev
  init: true
  volumes:
    - .:/src
    - cargo-registry:/usr/local/cargo/registry
    - target:/src/target

services:
  dev:
    <<: *dev
    stdin_open: true
    tty: true

  # Android builds of the app, in their own image (tools/android). Only with
  # --profile android, so `docker compose up` never builds it.
  android:
    <<: *dev
    build:
      context: tools/android
    image: branchbooks-android
    profiles: ["android"]
    devices:
      - /dev/kvm
    # The emulator needs the group that owns /dev/kvm on this machine: stat -c %g /dev/kvm.
    group_add:
      - "${KVM_GID:-992}"
    volumes:
      - .:/src
      - cargo-registry:/usr/local/cargo/registry
      - target:/src/target
      - gradle:/home/dev/.gradle
      - android-avd:/home/dev/.android

volumes:
  cargo-registry:
  target:
  gradle:
  android-avd:
